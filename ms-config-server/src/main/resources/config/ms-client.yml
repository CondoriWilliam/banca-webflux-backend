spring:
  application:
    name: ms-client
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/msvc-client-wbf
    username: postgres
    password: 1234

server:
  port: 8082

eureka:
  instance:
    hostname: msvc-discovery-server
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka


